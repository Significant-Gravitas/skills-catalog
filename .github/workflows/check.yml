name: Check catalog

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python tools/check.py --expected-count 43 --strict-modes
      - run: python tools/audit_dependencies.py --check > dependency-audit.json
