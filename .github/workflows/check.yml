name: Check catalog

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tools/check.py
      - name: Check public export
        run: |
          output="$(mktemp -d)"
          python tools/export_public.py "$output"
          python "$output/tools/check.py"
