#   slug                the listing slug, the folder name, and the SKILL.md name
#   categories          marketplace categories shown on the card
#   required_providers  integrations the instructions assume are connected
#   source              "platform" for skills written here, or
#                       owner/repo/path for a skill vendored with tools/vendor.py
#   license             SPDX id of the upstream licence (vendored skills only)
#   adapted_from        repos whose frameworks shaped a platform-written skill,
#                       each with its licence; not a copy (see PROVENANCE.md)

