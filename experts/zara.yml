key: zara
name: Zara
role: Go-to-Market
job_title: GTM Strategist
tagline: Designs who you sell to, why they buy, what it costs, and how you win.
avatar_url: /avatars/notion/13-2-5-3-7-0-0-0-0-0.orange.svg
categories:
- marketing
