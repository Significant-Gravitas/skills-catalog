routines:
- key: marketing-weekly-read
  title: What moved in marketing last week
  prompt: |-
    Settle the window before you touch a number: the most recent seven complete days, set against the seven complete days before them. A half-finished week is never lined up against a whole one.

        Gather the figures from connected sources or, failing that, the newest exports the owner pasted, along with the editorial calendar and last week's report. Then cover four things: spend and pipeline signals, how email and content moved, what shipped compared with what the calendar promised, and what is stuck.

        Lead with the largest change and take it apart using whatever columns you actually have. Each number names where it came from, and each line is tagged FACT, INFERENCE, or UNKNOWN. If the data does not explain a change, write one line admitting that and naming the single extra input that would; do not blame seasonality to fill the gap, and do not make up a metric.

        Check your log first so the same week is never reported twice. If the week was quiet, send the headline, the table, a one-line note that nothing much moved, and the stuck list. Save the report with its date, add this period's figures to the metrics history, and compare against the previous saved report. It lands at the owner's chosen destination as a draft; this run sends nothing to a channel or by email.
  crons:
  - H 9 * * 1
  asks:
  - Where do your marketing numbers live — HubSpot, exports, or pasted CSVs — and where is the editorial calendar?
  - What time should this land, and in which timezone?
  session_mode: THREAD
- key: marketing-content-pipeline-check
  title: What ships this week, and what is stuck
  prompt: |-
    Read the editorial calendar and your last check, then report in this order: what ships in the next seven days with the owner named on each line, what is late and by how far, what is stuck waiting on one person or one missing proof point, and what has no owner, no ship date, or no next step.

        Never flag the same stuck row two runs running unless it got worse. If nothing ships this week, nothing is late, and nothing has changed since your last run, say the pipeline is on track in one line and stop — no filler. Speak up the moment something newly slips, even if nothing else moved.

        One line per item, no preamble. Never invent an approval, a draft, or a date, and never quietly drop a row to make the week look clean — a dropped row gets a line saying who dropped it and why.
  crons:
  - H 9 * * 1-5
  asks:
  - Where is your editorial calendar?
  - What time should this land, and in which timezone?
  session_mode: THREAD
- key: marketing-competitor-watch
  title: What competitors shipped this week
  prompt: |-
    The watch list in memory is tiered, and each tier gets a different depth: Tier 1 direct competitors are read closely every week, Tier 2 adjacent players get a quick weekly skim, and Tier 3 aspirational brands are read once a month. For each one due this run, go through their public site, blog, and pricing, and keep a record of every URL you tried, failures included.

        Compare what you find with your log of past briefs; a change already covered is not covered again. A move you cannot link to stays out.

        Head the brief with a single line: the dates covered and the number of material changes. Then give each competitor that made a material move its own block, and give the rest nothing. Every line ends with its source link and date. After the blocks, write two to four lines on what it means for this owner's marketing: a launch is read for positioning, a price change for packaging, and a content push for what it does to our calendar. If a move's meaning is unclear, say so rather than guessing, and keep the brief only as long as the news.

        A week with no material moves gets a one-line brief saying it was quiet. In the month's final brief, add one to three proposed commitments for the content calendar: the openings this month's moves created and who should take each, as proposals. Save the brief with its date and deliver it to the owner's chosen destination as a draft; this run posts or sends it nowhere else.
  crons:
  - H 8 * * 5
  asks:
  - Which competitors should I watch, and where is the watch list kept?
  - What time should this land, and in which timezone?
  session_mode: FRESH
