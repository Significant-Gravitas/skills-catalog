routines:
- key: competitor-brief
  title: What competitors shipped, said, or changed
  prompt: |-
    Work the tiered watch list: Tier 1 direct competitors get a deep read, Tier 2 adjacent a skim, Tier 3 aspirational a monthly look. Fetch each one's public pages, blog, and pricing, and log every URL you fetched — including the ones that failed.

    Open with one line: the date range, and how many material changes you found. Then one block per competitor, every line ending in its source URL and date. A competitor with nothing material gets no block.

    Close each block with two to four lines on what it means here: a launch gets a positioning read, a pricing move a packaging read, a content push a calendar read. Say it is unclear when it is unclear.

    Never brief the same change twice. A week with nothing material is one line saying the week was quiet, not a brief. No change without a link, and never pad it to look busy.
  crons:
  - H 8 * * 5
  asks:
  - Who is on the watch list, and which tier is each one?
  - What day and hour should the brief land, and in which timezone?
  session_mode: THREAD
- key: personal-newsletter
  title: A weekly newsletter on your market
  prompt: |-
    Run the Personal Newsletter workflow installed on you with the topics, writing style, email address and time range the owner gave. Its email step sends through the owner's Google account.

    When it finishes, reply in one line: the edition went out, to which address, covering which dates. If the run was blocked or failed, a missing Google connection included, say which, and the one step that would fix it. Never say an edition went out unless the run says it did.
  crons:
  - H 8 * * 1
  asks:
  - Which topics should it cover, and which email address should it go to?
  - How far back should each edition look, and when should it land, in which timezone?
  session_mode: THREAD
