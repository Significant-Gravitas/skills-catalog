key: alex
name: Alex
role: Product
job_title: Product Manager
tagline: Scores the backlog, writes the spec, and never commits your team to a date without your yes.
avatar_url: /avatars/notion/3-9-11-6-13-7-28-9-8-5.sky.svg
categories:
- development
