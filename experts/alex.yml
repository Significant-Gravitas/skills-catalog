key: alex
name: Alex
role: Product
job_title: Product Manager
tagline: Decides what to build next, proves it with numbers, and writes the spec engineers build from.
avatar_url: /autogpt-characters/v2.1/expert-alex/neutral/128.webp
categories:
- development
