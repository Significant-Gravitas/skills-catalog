routines:
- key: weekly-product-review
  title: Weekly product review
  prompt: |-
    Review the roadmap against the backlog and the team's reality — shipped, slipped, stuck — and name the one decision the week needs.

    1. Read the roadmap, the scored backlog, and your last review. Log what you read and what you could not reach.
    2. Open with one line: the week, and how many now-items shipped, slipped, or went quiet. Then three short blocks: shipped; slipped with the reason and the new date; stuck with the owner and the unblock ask.
    3. Score the week's commitments red, yellow, or green. A slip with no new date is red. Say what drops if the week is overloaded — never silently carry everything forward.
    4. Show the same fixed KPI table every week — never drop a metric because it looks bad. Two real wins beat five forced ones.
    5. Never re-flag the same stuck item without noting it was flagged before and what changed since — check the items you reviewed in previous runs before you write.
    6. A week with everything on track is three lines saying so, not a report. Never pad to look busy.
    7. End with the forward half: Asks, each a decision needed from a named person by a date; and Plans, three to five outcome-led commitments for next week — plus the one call, the single decision, tradeoff, or cut the week needs, written so the decision maker can answer yes or no.
    8. Save the review dated and attach it here, for the owner to read first. The weekly is for leads only and replaces the standing review meeting; org-wide summaries go monthly.

    Send nothing to an exec, a lead, or a channel yourself. Hand the owner the draft and the recipient list, and let them send it.
  crons:
  - H 8 * * 1
  asks:
  - Which metrics home and roadmap should I read, and where should the review go?
  - What time should this land, and in which timezone?
  session_mode: THREAD
- key: competitor-watch
  title: Competitor watch
  prompt: |-
    Find out what the competitors on the watch list have shipped, repriced, or announced since the last run, and tell the owner only about the moves that matter to the roadmap. Copy tweaks and routine posts do not count.

    1. Before looking outward, note where the owner's own KPIs stand today, so every competitor move can be weighed against their numbers.
    2. Take the watch list from memory tier by tier and visit each competitor's changelog, pricing page, and blog. Keep a log of every address you tried, the failures included.
    3. Check the log of changes already briefed in earlier runs. Anything that appears there is old news; leave it out.
    4. The brief starts with a single line giving the window covered and the count of material changes. Below that, a section for each competitor that actually moved, and nothing at all for the ones that did not. Every line cites its link and the date the change happened, and a change you cannot link does not go in.
    5. Close with the implications: two to four lines tied to this owner's roadmap, each assigned to a named person. Read a launch for what it does to positioning and a price change for what it does to packaging. When the meaning is not yet clear, write that it is not clear. Once a month, make the brief a deeper one that covers strategic direction, the trends forming, and what they imply for the quarter.
    6. If nothing material happened, the whole brief is one line saying the market was quiet. Do not fill space.
    7. Where a change calls for a product decision, offer to open a tracker issue for it: one issue per change, with the link and date in the body. This run opens none itself.
    8. Save the brief with today's date and attach it here. This run publishes nothing by itself.
  crons:
  - H 9 * * 3
  asks:
  - Which competitors and sources should I watch, and where should I stage what I find?
  - What time should this land, and in which timezone?
  session_mode: THREAD
- key: voice-of-customer-pulse
  title: Voice of customer pulse
  prompt: |-
    Roll up the week's user feedback — interviews, tickets, surveys, reviews — into ranked themes with verbatim quotes and a roadmap verdict on each.

    1. Read the week's discovery notes, theme log, and any connected feedback sources. Log what you read and what you could not reach. Hold the floor: at least one customer interview every week — flag a week with none as a gap, and keep recruiting self-scheduling through in-product intercepts or a rotating customer panel.
    2. Mine for themes: rank by count, and lead each with the two quotes that carry it, speaker with role and date. Three accounts saying it is a pattern; one is an anecdote.
    3. Each theme gets a verdict: roadmap item, needs more evidence, or parked with the reason. Offer to file roadmap items as tracker issues; this run files none itself.
    4. Never brief the same theme twice without noting what is new since the last brief — check the themes you briefed in previous runs before you write.
    5. A week with no new feedback is one line saying the week was quiet, not a rollup. Never pad to look busy.
    6. Save the rollup dated and attach it here. This run posts nothing on its own, and never contacts a customer or an interviewee.
  crons:
  - H 16 * * 5
  asks:
  - Where do customer notes, tickets, or feedback live?
  - What time should this land, and in which timezone?
  session_mode: THREAD
