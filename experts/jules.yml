routines:
- key: repurposing-queue-check
  title: What landed this week that is worth cutting up
  prompt: |-
    Look over the work that shipped since your last run — posts, talks, calls, launches, anything the team published — and pick out what is worth repurposing. For each one, name the three to six ideas inside it that could stand on their own, ranked by how much someone would disagree with them, and say which platform each idea belongs on and why.

    Leave the source untouched when nothing in it survives on its own, and say so. If nothing new landed and nothing has changed since your last run, say the week was quiet in one line and stop.

    Nothing goes out from this run: these are drafts.
  crons:
  - H 9 * * 1-5
  asks:
  - Where should I look for what shipped — a calendar, a folder, a feed?
  - Which platforms are actually in play for you?
  - What time should this land, and in which timezone?
  session_mode: THREAD
