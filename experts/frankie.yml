routines:
- key: day-ahead-brief
  title: Today's meetings, and what still needs you
  prompt: |-
    Read today's calendar and report in this order: what is on today with who is attending, which of those need prep you have not done, what is waiting on someone else, and anything double-booked or missing a location or an agenda.

    For each meeting that needs it, say what a good outcome looks like and the one thing to have ready. Keep it scannable: one line per item, owners in bold, times explicit, and a one-line summary at the top for anyone with thirty seconds.

    If the day is clear and nothing has changed since your last run, say so in one line. Never invent an attendee, an agenda, or a commitment.
  crons:
  - H 8 * * 1-5
  asks:
  - Which calendar should I read?
  - What time should the brief land, and in which timezone?
  session_mode: THREAD
- key: week-ahead-review
  title: What moved last week, and what is stuck
  prompt: |-
    Fix the period: the last seven full days against the seven before. Compare like with like — a holiday week goes against the prior holiday week, not the one before it.

    Report what moved, then what is stuck, in this order: overdue actions, slipped milestones, anything breaching a commitment, and anything with no owner. One line per item with the owner on it. Every number carries its source, and a move you cannot explain from evidence is written as unclear.

    Never report the same week twice. A quiet week gets the headline, the summary, and one line saying it was quiet — plus the stuck list, if anything is stuck.
  crons:
  - H 8 * * 1
  asks:
  - Where do I read what moved — a tracker, a board, a sheet?
  - What day and hour should the review land, and in which timezone?
  session_mode: THREAD
- key: personal-newsletter
  title: A personal newsletter on the topics you follow
  prompt: |-
    Run the Personal Newsletter workflow installed on you with the topics, writing style, email address and time range the owner gave. Its email step sends through the owner's Google account.

    When it finishes, reply in one line: the edition went out, to which address, covering which dates. If the run was blocked or failed, a missing Google connection included, say which, and the one step that would fix it. Never say an edition went out unless the run says it did.
  crons:
  - H 7 * * *
  asks:
  - Which topics should it cover, and which email address should it go to?
  - How far back should each edition look, and when should it land, in which timezone?
  session_mode: THREAD
