<title>Expert Skill Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--surface-2:#ECEEF2;--surface-3:#E2E5EA;--line:#D9DDE4;--line-2:#C4CAD4;
  --ink:#14161B;--ink-2:#465061;--ink-3:#747D8C;--ink-inv:#FFFFFF;
  --g-original:#56677F;--g-nick:#4549CF;--g-toran:#9C2C74;--g-pr:#0C7468;
  --g-original-bg:#E6EAF0;--g-nick-bg:#E7E8FB;--g-toran-bg:#F6E4EF;--g-pr-bg:#DDF1EE;
  --ok:#1C7337;--ok-bg:#E1F2E6;--warn:#9A5400;--warn-bg:#FBEEDB;--bad:#B0261B;--bad-bg:#FBE4E1;
  --hl:#FFE47A;--hl-ink:#2E2400;--iss:#D97718;--focus:#2F6FEB;
  --s1:#E4E8EE;--s2:#BFC8D6;--s3:#8B99B0;--s4:#52668A;--s5:#1F3257;
  --shadow:0 1px 2px rgba(20,22,27,.06),0 8px 24px rgba(20,22,27,.08);
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1014;--surface:#161920;--surface-2:#1D2129;--surface-3:#252A34;--line:#2A303B;--line-2:#3A414E;
  --ink:#E6E8EC;--ink-2:#AAB1BD;--ink-3:#7B8391;--ink-inv:#0E1014;
  --g-original:#9AAAC2;--g-nick:#9A9EFF;--g-toran:#E583C4;--g-pr:#52C7B6;
  --g-original-bg:#232A36;--g-nick-bg:#23244A;--g-toran-bg:#3A1C30;--g-pr-bg:#123530;
  --ok:#62C983;--ok-bg:#15301E;--warn:#E6A850;--warn-bg:#352512;--bad:#F2786C;--bad-bg:#3A1A17;
  --hl:#5E4E0E;--hl-ink:#FFF2BF;--iss:#F09A45;--focus:#7AA5FF;
  --s1:#252A33;--s2:#384254;--s3:#55678A;--s4:#8FA3C6;--s5:#D2DDF2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1014;--surface:#161920;--surface-2:#1D2129;--surface-3:#252A34;--line:#2A303B;--line-2:#3A414E;
  --ink:#E6E8EC;--ink-2:#AAB1BD;--ink-3:#7B8391;--ink-inv:#0E1014;
  --g-original:#9AAAC2;--g-nick:#9A9EFF;--g-toran:#E583C4;--g-pr:#52C7B6;
  --g-original-bg:#232A36;--g-nick-bg:#23244A;--g-toran-bg:#3A1C30;--g-pr-bg:#123530;
  --ok:#62C983;--ok-bg:#15301E;--warn:#E6A850;--warn-bg:#352512;--bad:#F2786C;--bad-bg:#3A1A17;
  --hl:#5E4E0E;--hl-ink:#FFF2BF;--iss:#F09A45;--focus:#7AA5FF;
  --s1:#252A33;--s2:#384254;--s3:#55678A;--s4:#8FA3C6;--s5:#D2DDF2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--g-nick)}
code,.mono{font-family:var(--f-mono);font-size:.86em}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:.005em;text-wrap:balance;margin:0}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.eyebrow{font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:19px;font-weight:700}
.brand .mark{font:500 12px var(--f-mono);color:var(--ink-3)}
.views{display:flex;gap:2px;background:var(--surface-2);border-radius:8px;padding:3px}
.views button{border:0;background:none;padding:5px 12px;border-radius:6px;font-weight:500;color:var(--ink-2)}
.views button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sync{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}
.layout{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:calc(100vh - 54px)}
.rail{border-right:1px solid var(--line);background:var(--surface);padding:14px 12px 40px;position:sticky;top:calc(54px + env(safe-area-inset-top,0px));
  height:calc(100vh - 54px);overflow:auto}
.rail input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.rail-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:1px}
.rail-item{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:7px;border:0;background:none;text-align:left;width:100%}
.rail-item:hover{background:var(--surface-2)}
.rail-item[aria-current="true"]{background:var(--surface-3)}
.rail-item .nm{font-weight:600}
.rail-item .rl{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-item .ct{font:500 11px var(--f-mono);color:var(--ink-3)}
.st{width:14px;height:14px;border-radius:50%;border:1.6px solid var(--ink-3);display:inline-block;position:relative}
.st.reviewing{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.st.done{border-color:var(--ok);background:var(--ok)}
.st.done::after{content:"";position:absolute;left:3.5px;top:1.2px;width:3.5px;height:7px;border:solid var(--ink-inv);border-width:0 1.8px 1.8px 0;transform:rotate(45deg)}
main{min-width:0;padding-block:22px 80px;padding-inline:28px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px}
.banner.warn{border-color:var(--warn);background:var(--warn-bg)}
.banner.claude{border-left:3px solid var(--g-nick)}

/* ---------- chips */
.chip{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--f-body);padding:4px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.g-original{background:var(--g-original-bg);color:var(--g-original)}
.chip.g-nick{background:var(--g-nick-bg);color:var(--g-nick)}
.chip.g-toran{background:var(--g-toran-bg);color:var(--g-toran)}
.chip.g-pr{background:var(--g-pr-bg);color:var(--g-pr)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.line{background:none;border:1px solid var(--line-2)}
.gbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);min-width:80px}
.gbar i{display:block;height:100%}
.gbar .g-original{background:var(--g-original)}.gbar .g-nick{background:var(--g-nick)}.gbar .g-toran{background:var(--g-toran)}.gbar .g-pr{background:var(--g-pr)}
.stripe{width:4px;align-self:stretch;border-radius:2px}
.stripe.g-original{background:var(--g-original)}.stripe.g-nick{background:var(--g-nick)}.stripe.g-toran{background:var(--g-toran)}.stripe.g-pr{background:var(--g-pr)}

/* ---------- score */
.score{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--f-mono)}
.score .bar{width:46px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.score .bar i{display:block;height:100%}
.band-bad{color:var(--bad)}.band-warn{color:var(--warn)}.band-ok{color:var(--ok)}
.bar i.band-bad{background:var(--bad)}.bar i.band-warn{background:var(--warn)}.bar i.band-ok{background:var(--ok)}
.dims{display:inline-grid;grid-template-columns:repeat(7,12px);gap:2px;vertical-align:middle}
.dims i{width:12px;height:12px;border-radius:2px;display:block}
.s1{background:var(--s1)}.s2{background:var(--s2)}.s3{background:var(--s3)}.s4{background:var(--s4)}.s5{background:var(--s5)}

/* ---------- expert header */
.xhead{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;margin-bottom:14px}
.xhead h2{font-size:30px;font-weight:700;line-height:1.1}
.xhead .role{font-size:15px;color:var(--ink-2);margin-top:4px}
.xhead .tag{margin-top:6px;color:var(--ink-3)}
.statusSeg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.seg button:hover{border-color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ink-inv);border-color:var(--ink)}
.seg button[data-choice="reject"][aria-pressed="true"],.seg button[data-choice="drop"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button[data-choice="accept"][aria-pressed="true"],.seg button[data-choice="keep"][aria-pressed="true"],.seg button[data-choice="done"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:18px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px}
.stat .v{font:600 20px var(--f-display)}
.stat .k{font-size:11.5px;color:var(--ink-3)}
.summary{max-width:78ch;font-size:14.5px;color:var(--ink-2);margin:0 0 16px}
.summary.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tabs{position:sticky;top:calc(54px + env(safe-area-inset-top,0px));z-index:20;background:var(--bg);display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px;padding-top:6px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .n{font:500 11px var(--f-mono);color:var(--ink-3);margin-left:4px}

/* ---------- conflict blocks */
.conflict{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.conflict-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.marker{font:500 12px var(--f-mono);color:var(--ink-3)}
.conflict-head h3{font-size:16px;font-weight:600;margin-right:auto}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;border-bottom:1px solid var(--line)}
.lane{display:flex;gap:10px;padding:12px 14px;border-right:1px solid var(--line);min-width:0}
.lane:last-child{border-right:0}
.lane .body{min-width:0;display:flex;flex-direction:column;gap:5px}
.lane .ttl{font-weight:600;word-break:break-word}
.lane .slug{font:12px var(--f-mono);color:var(--ink-3);word-break:break-all}
.lane .lnote{font-size:12.5px;color:var(--ink-2)}
.mrole{font:600 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:4px;border:1px solid var(--line-2);color:var(--ink-2)}
.mrole.base{border-color:var(--ok);color:var(--ok)}
.mrole.redundant{border-color:var(--bad);color:var(--bad)}
.mrole.graft{border-color:var(--warn);color:var(--warn)}
.resolution{padding:12px 14px;display:grid;gap:8px}
.resolution .res-t{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.resolution .res-t b{font-size:15px}
.resolution ul{margin:0;padding-left:18px}
.resolution li{margin:3px 0}
.decide{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;border-top:1px dashed var(--line);background:var(--bg)}
.decide select,.decide input[type=text]{border:1px solid var(--line-2);border-radius:6px;padding:4px 8px;background:var(--surface);max-width:100%}
.decide input[type=text]{flex:1 1 240px}
.linkbtn{border:0;background:none;padding:0;color:var(--g-nick);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.iconbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--ink-3);color:var(--ink)}

/* ---------- tables / rows */
.section{margin:24px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.section h3{font-size:18px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:4px minmax(0,2.2fr) auto auto auto auto;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .t{min-width:0}
.row .t b{display:block;font-weight:600;word-break:break-word}
.row .t span{font-size:12.5px;color:var(--ink-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tags{display:flex;gap:4px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:12px;color:var(--ink-3)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;min-width:880px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h4{font-size:16px}
.card ul{margin:0;padding-left:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .v{font:700 26px var(--f-display)}
.kpi .k{font-size:12px;color:var(--ink-3)}
.kpi .sub{font-size:12px;color:var(--ink-2);margin-top:2px}

/* ---------- kit */
.kit{display:grid;grid-template-columns:1fr 1.4fr;gap:16px}
.kit ol{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kit li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.kit li:last-child{border-bottom:0}
.kit .pos{font:500 12px var(--f-mono);color:var(--ink-3)}
.kit li.rejected .t{text-decoration:line-through;color:var(--ink-3)}
.kit .t b{display:block;font-weight:600}
.kit .t span{font-size:12.5px;color:var(--ink-3)}

/* ---------- prose / markdown */
.prose{max-width:82ch;line-height:1.62}
.prose h1{font-size:22px;margin:18px 0 8px}.prose h2{font-size:18px;margin:20px 0 8px}.prose h3{font-size:15.5px;margin:16px 0 6px}.prose h4{font-size:14px;margin:14px 0 6px}
.prose p{margin:8px 0}
.prose ul,.prose ol{padding-left:22px;margin:6px 0}
.prose li{margin:3px 0}
.prose pre{background:var(--surface-2);padding:10px 12px;border-radius:8px;overflow-x:auto;font-size:12.5px}
.prose code{background:var(--surface-2);padding:1px 4px;border-radius:4px}
.prose pre code{background:none;padding:0}
.prose table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;font-size:13px}
.prose th,.prose td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.prose blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--line-2);color:var(--ink-2)}
.raw{white-space:pre-wrap;word-break:break-word;font:12.5px/1.55 var(--f-mono);background:var(--surface-2);padding:12px;border-radius:8px;max-width:100%;overflow-x:auto}
mark.note-hl{background:var(--hl);color:var(--hl-ink);border-radius:2px;cursor:pointer;padding:0 1px}
mark.iss-hl{background:none;color:inherit;text-decoration:underline wavy var(--iss);text-decoration-thickness:1.4px;text-underline-offset:3px;cursor:help}
mark.flash{outline:2px solid var(--focus);outline-offset:1px}
.fm{font:12px var(--f-mono);color:var(--ink-3);background:var(--surface-2);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
.diff{font:12px/1.5 var(--f-mono);white-space:pre;overflow-x:auto;background:var(--surface-2);border-radius:8px;padding:8px 0;max-height:70vh}
.diff div{padding:0 12px}
.diff .add{background:var(--ok-bg);color:var(--ok)}.diff .del{background:var(--bad-bg);color:var(--bad)}.diff .hunk{color:var(--g-nick)}

/* ---------- reader sheet */
.sheet-back{position:fixed;inset:0;background:rgba(10,12,16,.35);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(1120px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{padding:14px 22px 0;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-h .top{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.sheet-h h3{font-size:21px;flex:1 1 300px}
.sheet-h .desc{color:var(--ink-2);margin:6px 0 10px;max-width:90ch}
.sheet-b{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0}
.sheet-main{padding:18px 22px 60px;min-width:0}
.sheet-side{border-left:1px solid var(--line);padding:16px;background:var(--surface);min-width:0}
.closebtn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 12px;font-weight:600}
.files{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.files button{border:0;background:none;text-align:left;padding:5px 8px;border-radius:6px;font:12.5px var(--f-mono);color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.files button:hover,.files button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}

/* ---------- notes */
.note{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:10px 12px;display:grid;gap:6px}
.note .q{font-size:12.5px;color:var(--ink-2);border-left:3px solid var(--hl);padding-left:8px;background:var(--surface-2);border-radius:0 4px 4px 0;padding-block:3px}
.note .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-3)}
.note .txt{white-space:pre-wrap;word-break:break-word}
.note .reply{border-left:3px solid var(--g-nick);padding:4px 8px;background:var(--g-nick-bg);border-radius:0 6px 6px 0;font-size:13px;white-space:pre-wrap}
.note.resolved{opacity:.65}
.notes-list{display:grid;gap:8px}
.composer-back{position:fixed;inset:0;background:rgba(10,12,16,.35);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.composer{width:min(620px,100%);background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:16px;display:grid;gap:10px;margin-bottom:env(safe-area-inset-bottom,0px)}
.composer textarea{width:100%;min-height:110px;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;background:var(--bg);resize:vertical}
.composer .q{max-height:120px;overflow:auto}

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
"use strict";
const GROUPS = {
  original: {label: "Original", long: "Original roster · pre-PR 2", cls: "g-original"},
  nick: {label: "Nick · PR 2", long: "Nick · PR 2 (167 skills)", cls: "g-nick"},
  toran: {label: "Toran · 74", long: "Toran · 74 upstream packages", cls: "g-toran"},
  pr: {label: "PR rebuild", long: "Open rebuild PRs (#14 Mina, #15 Harper, #16 Sofia)", cls: "g-pr"},
};
const DIMS = [["trigger","Trigger"],["procedure","Procedure"],["output","Output"],["expertise","Expertise"],["guardrails","Guardrails"],["platform_fit","Platform fit"],["efficiency","Efficiency"]];
const CLUSTER_CHOICES = [["accept","Accept proposal"],["base","Use a different base"],["separate","Keep separate"],["drop","Drop all"],["discuss","Discuss"]];
const SKILL_CHOICES = [["keep","Keep"],["merge","Merge"],["rewrite","Rewrite"],["move","Move expert"],["drop","Drop"],["discuss","Discuss"]];
const REC_CHOICES = [["accept","Accept"],["maybe","Maybe"],["reject","Reject"]];
const NOTE_TYPES = [["comment","Comment"],["change","Change request"],["question","Question"],["keep","Keep this"],["drop","Cut this"]];

const S = {index: null, cache: {}, key: null, view: "overview", tab: "merge", notes: [], decisions: {}, status: {}, meta: {},
  db: null, dbState: "connecting", me: null, user: null, names: {}, reader: null, pending: null};

function esc(s){return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function $(sel, root=document){return root.querySelector(sel);}
function $$(sel, root=document){return Array.from(root.querySelectorAll(sel));}
function docId(s){return String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_").slice(0, 190);}




function groupChip(g, pr){
  const G = GROUPS[g] || {label: g, cls: ""};
  return `<span class="chip ${G.cls}">${esc(g === "pr" && pr ? "PR #" + pr : G.label)}</span>`;
}
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
function md(text){
  if (window.marked && window.DOMPurify) {
    try { return DOMPurify.sanitize(marked.parse(String(text || ""), {gfm: true})); } catch (e) {}
  }
  return `<pre class="raw">${esc(text)}</pre>`;
}
function relTime(ts){
  if (!ts) return "";
  const d = new Date(ts); if (isNaN(d)) return "";
  return d.toLocaleString(undefined, {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"});
}

/* ---------------- data */
async function loadIndex(){
  const r = await fetch("data/index.json"); S.index = await r.json();
}
async function loadExpert(key){
  if (S.cache[key]) return S.cache[key];
  const r = await fetch(`data/x/${key}.json`); const d = await r.json();
  S.cache[key] = d; return d;
}
function skillOf(d, ref){ return d.skills[ref] || d.extra[ref] || null; }
function clusterOf(d, ref){
  if (!d.analysis) return null;
  return (d.analysis.clusters || []).find(c => (c.members || []).some(m => m.ref === ref)) || null;
}

/* ---------------- db */
async function initDb(){
  const cl = window.claude;
  if (!cl || !cl.use) { setSync("off", "Notes can't be saved outside claude.ai"); return; }
  try {
    const [db, user] = await Promise.all([cl.use("db"), cl.use("user")]);
    S.user = user;
    if (user) { try { S.me = await user.id(); } catch (e) {} }
    if (!db) { setSync("off", "Saving is unavailable in this view"); return; }
    S.db = db;
    setSync("on", "Live · notes save for everyone");
    db.collection("notes").onSnapshot(snap => {
      S.notes = snap.docs.map(d => Object.assign({id: d.id}, d.data()));
      resolveNames(); onDataChange("notes");
    }, onDbError);
    db.collection("decisions").onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S.decisions = m; onDataChange("decisions");
    }, onDbError);
    db.collection("status").onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S.status = m; onDataChange("status");
    }, onDbError);
    db.collection("meta").onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S.meta = m; onDataChange("meta");
    }, onDbError);
  } catch (e) { setSync("off", "Saving is unavailable in this view"); }
}
function onDbError(e){
  if (e && e.code === "revoked") setSync("off", "Access changed; reload to continue");
  else setSync("off", "Lost connection to saved notes");
}
function setSync(state, text){
  S.dbState = state; $("#syncDot").className = "dot " + (state === "on" ? "on" : state === "off" ? "off" : "");
  $("#syncText").textContent = text;
}
async function resolveNames(){
  if (!S.user || !S.user.profiles) return;
  const ids = [...new Set(S.notes.map(n => n.author).filter(Boolean))].filter(id => !(id in S.names));
  if (!ids.length) return;
  try { const ps = await S.user.profiles(ids); ids.forEach(id => { S.names[id] = (ps[id] && ps[id].name) || ""; }); onDataChange("names"); } catch (e) {}
}
function authorName(id){
  if (!id) return "Someone";
  if (id === S.me) return "You";
  return S.names[id] || "Someone";
}
function canWrite(){ return !!S.db; }
async function saveDecision(id, patch){
  if (!canWrite()) { toast("Saving is unavailable in this view"); return; }
  const cur = S.decisions[id] || {};
  const body = Object.assign({}, cur, patch, {updatedAt: new Date().toISOString(), author: S.me || null});
  S.decisions[id] = body; onDataChange("decisions");
  try { await S.db.doc("decisions/" + id).set(body); } catch (e) { toast("Couldn't save that choice. Try again."); }
}
async function addNote(note){
  if (!canWrite()) { toast("Saving is unavailable in this view"); return false; }
  const body = Object.assign({status: "open", createdAt: new Date().toISOString(), author: S.me || null}, note);
  try { await S.db.collection("notes").add(body); toast("Note saved"); return true; }
  catch (e) { toast(e && e.code === "quota_exceeded" ? "The notes store is full; resolve and delete old notes." : "Couldn't save the note. Try again."); return false; }
}
async function updateNote(id, patch){
  if (!canWrite()) return;
  try { await S.db.doc("notes/" + id).update(Object.assign({updatedAt: new Date().toISOString()}, patch)); } catch (e) { toast("Couldn't update the note."); }
}
async function deleteNote(id){
  if (!canWrite()) return;
  try { await S.db.doc("notes/" + id).delete(); toast("Note deleted"); } catch (e) { toast("Couldn't delete the note."); }
}
async function setStatus(key, state){
  if (!canWrite()) { toast("Saving is unavailable in this view"); return; }
  S.status[key] = {state, updatedAt: new Date().toISOString()}; onDataChange("status");
  try { await S.db.doc("status/" + key).set(S.status[key]); } catch (e) { toast("Couldn't save the status."); }
}

let dataTimer = null;
function onDataChange(kind){
  clearTimeout(dataTimer);
  dataTimer = setTimeout(() => {
    renderRail();
    syncDecisions();
    refreshNoteCounts();
    if (S.view === "overview") renderOverview();
    if (S.view === "expert" && (S.tab === "notes" || (kind === "decisions" && (S.tab === "kit" || S.tab === "skills")))) renderTabBody();
    if (S.view === "roster" && kind !== "decisions") renderRoster();
    if (S.reader) refreshReaderNotes();
    applyAllNoteHighlights();
  }, 60);
}

/* ---------------- navigation */
function go(view, key, tab){
  S.view = view;
  if (key) S.key = key;
  if (tab) S.tab = tab;
  $$(".views button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  const h = view === "expert" && S.key ? S.key : view;
  if (location.hash.slice(1) !== h) history.replaceState(null, "", "#" + h);
  render();
}
async function render(){
  closeReader(true);
  if (!S.focusUserSet && S.view !== "expert") document.body.classList.remove("focus");
  renderRail();
  if (S.view === "overview") return renderOverview();
  if (S.view === "roster") return renderRoster();
  if (!S.key) S.key = S.index.experts[0].key;
  const main = $("#main");
  main.innerHTML = `<div class="empty">Loading ${esc(S.key)}…</div>`;
  const d = await loadExpert(S.key);
  renderExpert(d);
}

/* ---------------- rail */
function notesFor(key){ return S.notes.filter(n => n.expert === key); }
function openCount(key){ return notesFor(key).filter(n => n.status !== "resolved").length; }
function renderRail(){
  if (!S.index) return;
  const q = ($("#railSearch").value || "").toLowerCase();

/* ---------------- merge editor */
function rid(){ return Math.random().toString(36).slice(2, 10); }

function splitSections(text){
  const lines = String(text || "").split("\n"); const out = []; let cur = {heading: "", lines: []}; let fence = false;
  const push = () => { if (cur.heading || cur.lines.some(l => l.trim())) out.push(cur); };
  for (const ln of lines) {
    if (/^\s*(```|~~~)/.test(ln)) fence = !fence;
    if (!fence && /^#{1,2}\s+\S/.test(ln)) { push(); cur = {heading: ln.replace(/^#+\s*/, "").trim(), lines: [ln]}; }
    else cur.lines.push(ln);
  }

  return out.map((x, i) => ({i, h: normH(x.heading), heading: x.heading, text: x.lines.join("\n").replace(/^\n+|\n+$/g, "")}));

function findSec(secs, heading){

  let x = secs.find(y => y.h === h); if (x) return x.i;
  x = secs.find(y => y.text.split("\n").some(l => /^#{1,6}\s/.test(l) && normH(l) === h)); if (x) return x.i;
  x = secs.find(y => y.h && (y.h.startsWith(h) || h.startsWith(y.h))); return x ? x.i : -1;

/* ---------------- highlights */
function mdPlain(q){
  return String(q || "").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/\*\*|__|`/g, "").replace(/^\s*(?:[-*+]|\d+\.)\s+/, "").replace(/^#+\s*/, "").replace(/\s+/g, " ").trim();
}
function highlight(root, quote, cls, title, idAttr, noteId){
  if (!root) return false;
  const q = mdPlain(quote).toLowerCase(); if (q.length < 3) return false;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n => n.parentElement && n.parentElement.closest("script,style") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const nodes = []; let full = ""; let n;
  while ((n = walker.nextNode())) { nodes.push({n, start: full.length}); full += n.nodeValue; }
  let norm = "", map = [], prev = false;
  for (let i = 0; i < full.length; i++) {
    const ch = full[i]; const sp = /\s/.test(ch);
    if (sp) { if (prev) continue; norm += " "; map.push(i); prev = true; }
    else { norm += ch.toLowerCase(); map.push(i); prev = false; }
  }
  const at = norm.indexOf(q); if (at < 0) return false;
  const s = map[at], e = map[at + q.length - 1] + 1;
  for (const {n, start} of nodes) {
    const end = start + n.nodeValue.length;
    if (end <= s || start >= e) continue;
    const a = Math.max(s, start) - start, b = Math.min(e, end) - start;
    if (b <= a) continue;
    try {
      const r = document.createRange(); r.setStart(n, a); r.setEnd(n, b);
      const m = document.createElement("mark"); m.className = cls; if (title) m.title = title;
      if (idAttr) m.dataset.iss = idAttr; if (noteId) m.dataset.noteId = noteId;
      r.surroundContents(m);
    } catch (err) {}
  }
  return true;
}
function applyAllNoteHighlights(){
  $$("mark.note-hl").forEach(m => { const p = m.parentNode; while (m.firstChild) p.insertBefore(m.firstChild, m); p.removeChild(m); p.normalize(); });
  $$("[data-annot]").forEach(el => {
    const ex = el.dataset.expert, ref = el.dataset.ref, file = el.dataset.file || null;
    S.notes.filter(n => n.expert === ex && n.ref === ref && n.quote && n.status !== "resolved" && (!file || (n.file || "SKILL.md") === file))
      .forEach(n => highlight(el, n.quote, "note-hl", n.body, null, n.id));
  });
}

  });
  $$("[data-dec-note]").forEach(inp => { if (document.activeElement !== inp) inp.value = (S.decisions[inp.dataset.decNote] || {}).note || ""; });
  $$("[data-dec-base]").forEach(sel => { sel.value = (S.decisions[sel.dataset.decBase] || {}).base || ""; });
  $$("[data-status]").forEach(b => b.setAttribute("aria-pressed", String(((S.status[S.key] || {}).state || "todo") === b.dataset.status)));
}
const noteTimers = {};
function decisionTarget(id){
  const parts = id.split("__");
  return {expert: parts[0], kind: parts[1] || "", target: parts.slice(2).join("__")};
}

/* ---------------- selection → note */
function annotCtx(el){
  return {kind: el.dataset.annot, expert: el.dataset.expert || S.key, ref: el.dataset.ref || null, file: el.dataset.file || null, field: el.dataset.field || null};
}
function nearestHeading(container, node){
  const hs = $$("h1,h2,h3,h4", container);
  let last = null;
  for (const h of hs) { if (h.compareDocumentPosition(node) & Node.DOCUMENT_POSITION_FOLLOWING) last = h; }
  return last ? last.textContent.trim().slice(0, 120) : null;
}
function onSelection(){
  const tip = $("#selTip");
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) { tip.hidden = true; return; }
  const r = sel.getRangeAt(0);
  const el1 = (r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement);
  const el2 = (r.endContainer.nodeType === 1 ? r.endContainer : r.endContainer.parentElement);
  const c1 = el1 && el1.closest("[data-annot]"), c2 = el2 && el2.closest("[data-annot]");
  if (!c1 || c1 !== c2) { tip.hidden = true; return; }
  const text = sel.toString().replace(/\s+/g, " ").trim();
  if (text.length < 2) { tip.hidden = true; return; }
  S.pending = Object.assign(annotCtx(c1), {quote: text.slice(0, 900), section: nearestHeading(c1, r.startContainer)});
  const rect = r.getBoundingClientRect();
  tip.hidden = false;
  const top = Math.max(8, rect.top - 40);
  tip.style.top = top + "px";
  tip.style.left = Math.min(window.innerWidth - 200, Math.max(8, rect.left + rect.width / 2 - 80)) + "px";
}
function openComposer(ctx, existing){
  if (!canWrite()) { toast("Saving is unavailable in this view"); return; }
  const root = document.createElement("div");
  root.className = "composer-back"; root.id = "composerBack";
  const title = existing ? "Edit note" : ctx.quote ? "Note on selection" : "Note";
  const where = [ctx.kind, ctx.ref, ctx.file && ctx.file !== "SKILL.md" ? ctx.file : null, ctx.section ? "§ " + ctx.section : null].filter(Boolean).join(" · ");
  root.innerHTML = `<div class="composer" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b>${esc(title)}</b><span class="muted small mono">${esc(where)}</span></div>
    ${ctx.quote ? `<div class="note"><div class="q">${esc(ctx.quote)}</div></div>` : ""}
    <textarea id="cmpText" placeholder="What should change, stay, or be answered?">${esc(existing ? existing.body : "")}</textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select id="cmpType" aria-label="Note type">${NOTE_TYPES.map(([k, l]) => `<option value="${k}" ${existing && existing.type === k ? "selected" : ""}>${l}</option>`).join("")}</select>
      <span style="margin-left:auto;display:flex;gap:8px"><button class="btn ghost" id="cmpCancel">Cancel</button><button class="btn" id="cmpSave">${existing ? "Save" : "Add note"}</button></span></div></div>`;
  document.body.appendChild(root);
  const ta = $("#cmpText"); ta.focus();
  const close = () => root.remove();
  root.addEventListener("click", e => { if (e.target === root) close(); });
  $("#cmpCancel").onclick = close;
  ta.addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") $("#cmpSave").click(); if (e.key === "Escape") close(); });
  $("#cmpSave").onclick = async () => {
    const body = ta.value.trim(); if (!body) { ta.focus(); return; }
    $("#cmpSave").disabled = true;
    if (existing) { await updateNote(existing.id, {body, type: $("#cmpType").value}); close(); return; }
    const ok = await addNote({expert: ctx.expert || S.key, kind: ctx.kind, ref: ctx.ref, file: ctx.file || null, field: ctx.field || null, section: ctx.section || null, quote: ctx.quote || null, body, type: $("#cmpType").value});
    if (ok) close(); else $("#cmpSave").disabled = false;
  };
}

/* ---------------- events */
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-go],[data-open],[data-close],tr[data-go],.row[data-open],mark");
  if (!t) return;
  if (t.matches("mark.note-hl")) {
    const n = S.notes.find(x => x.id === t.dataset.noteId);
    if (n) { const card = $(`[data-note="${CSS.escape(n.id)}"]`); if (card) { card.scrollIntoView({block: "center", behavior: "smooth"}); card.style.outline = "2px solid var(--focus)"; setTimeout(() => card.style.outline = "", 1400); } }
    return;
  }
  if (t.dataset.close) { closeReader(); return; }
  if (t.dataset.view) { go(t.dataset.view); return; }
  if (t.dataset.go !== undefined && t.dataset.go) {
    const k = t.dataset.go;
    if (S.index.experts.some(x => x.key === k)) { closeReader(); go("expert", k, S.tab); }
    return;
  }
  if (t.dataset.open) { openReader(t.dataset.open, t.dataset.file ? {tab: t.dataset.file && t.dataset.file !== "SKILL.md" ? "files" : "skill", file: t.dataset.file} : null); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; renderTabBody(); return; }
  if (t.dataset.rtab) { S.reader.tab = t.dataset.rtab; renderReader(); return; }
  if (t.dataset.rfile) { S.reader.file = t.dataset.rfile; renderReader(); return; }
  if (t.dataset.raw) { S.reader.raw = !S.reader.raw; renderReader(); return; }
  if (t.dataset.jumpIssue !== undefined) {
    S.reader.tab = "skill"; renderReader();
    const m = $(`mark[data-iss="iss-${t.dataset.jumpIssue}"]`);
    if (m) { m.scrollIntoView({block: "center", behavior: "smooth"}); m.classList.add("flash"); setTimeout(() => m.classList.remove("flash"), 1600); } else toast("That quote isn't in the rendered text");
    return;
  }
  if (t.dataset.jumpCluster) { closeReader(); S.tab = "merge"; const d0 = S.cache[S.key]; S.mcid = S.mcid || {}; S.mcid[S.key] = t.dataset.jumpCluster; renderTabBody(); const v = $(".mv-nav"); if (v) v.scrollIntoView({block: "start", behavior: "smooth"}); return; }
  if (t.dataset.status) { setStatus(S.key, t.dataset.status); return; }
  if (t.dataset.noteTarget) { const ctx = JSON.parse(t.dataset.noteTarget); openComposer(Object.assign({expert: S.key}, ctx)); return; }
  if (t.dataset.choice && t.parentElement && t.parentElement.dataset.dec) {
    const id = t.parentElement.dataset.dec; const cur = (S.decisions[id] || {}).choice;
    const next = cur === t.dataset.choice ? null : t.dataset.choice;
    saveDecision(id, Object.assign({choice: next}, decisionTarget(id))); return;
  }
  if (t.dataset.kitmove) {
    const d = S.cache[S.key]; const id = docId(`${S.key}__kitorder`);
    const cur = (S.decisions[id] && S.decisions[id].order) || d.analysis.proposed_kit.map(k => k.slug);
    const order = cur.slice(); d.analysis.proposed_kit.forEach(k => { if (!order.includes(k.slug)) order.push(k.slug); });
    const i = order.indexOf(t.dataset.kitmove), j = i + Number(t.dataset.dir);
    if (i < 0 || j < 0 || j >= order.length) return;
    [order[i], order[j]] = [order[j], order[i]];
    saveDecision(id, {order, expert: S.key, kind: "kitorder"}).then(() => renderTabBody()); renderTabBody(); return;
  }
  if (t.dataset.noteAct) {
    const card = t.closest("[data-note]"); const n = S.notes.find(x => x.id === card.dataset.note); if (!n) return;
    const act = t.dataset.noteAct;
    if (act === "resolve") updateNote(n.id, {status: "resolved"});
    else if (act === "reopen") updateNote(n.id, {status: "open"});
    else if (act === "edit") openComposer({kind: n.kind, ref: n.ref, file: n.file, section: n.section, quote: n.quote, expert: n.expert}, n);
    else if (act === "delete") {
      if (t.dataset.armed) deleteNote(n.id);
      else { t.dataset.armed = "1"; t.textContent = "Confirm delete"; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = "Delete"; } }, 3000); }
    } else if (act === "jump") {
      if (n.kind === "skill") { openReader(n.ref, {tab: n.file && n.file !== "SKILL.md" ? "files" : "skill", file: n.file}); setTimeout(() => flashNote(n.id), 60); }
      else if (n.kind === "body") { S.tab = "body"; renderTabBody(); flashNote(n.id); }
      else if (n.kind === "cluster" || n.kind === "merged") { S.tab = "merge"; S.mcid = S.mcid || {}; S.mcid[S.key] = n.ref; if (n.kind === "cluster") S.mplan = true; renderTabBody(); setTimeout(() => flashNote(n.id), 60); }
      else if (n.kind === "rec") { S.tab = "recs"; renderTabBody(); flashNote(n.id); }
      else flashNote(n.id);
    }
    return;
  }
  if (t.dataset.mvnav) { const d = S.cache[S.key]; const cl = d.analysis.clusters; const c = curCluster(d); const i = cl.indexOf(c); const j = Math.max(0, Math.min(cl.length - 1, i + Number(t.dataset.mvnav))); S.mcid[S.key] = cl[j].id; renderTabBody(); window.scrollTo({top: 0}); return; }
  if (t.dataset.focus) { S.focusUserSet = true; document.body.classList.toggle("focus"); t.setAttribute("aria-pressed", String(document.body.classList.contains("focus"))); return; }
  if (t.dataset.take) { meTake(t.dataset.k, t.dataset.take); return; }
  if (t.dataset.rowact) { meRowAct(t.dataset.rowact, t.dataset.id); return; }
  if (t.dataset.dismiss !== undefined || t.dataset.undismiss !== undefined) {
    const d = S.cache[S.key]; const ms = msFor(d, curCluster(d)); const e = ms.disp[Number(t.dataset.dismiss ?? t.dataset.undismiss)]; if (!e) return;
    const keys = []; if (e.li >= 0) keys.push(orphanKey("A", ms.left, ms.L[e.li])); if (e.ri >= 0) keys.push(orphanKey("B", ms.right, ms.R[e.ri]));
    pushHist(ms); ms.dismissed = t.dataset.dismiss !== undefined ? ms.dismissed.concat(keys) : ms.dismissed.filter(x => !keys.includes(x)); msChanged(ms); return;
  }
  if (t.dataset.fmtake) {
    const d = S.cache[S.key]; const ms = msFor(d, curCluster(d)); const sk = skillOf(d, t.dataset.fmtake === "A" ? ms.left : ms.right); if (!sk) return;
    pushHist(ms); ms.fm = Object.assign({}, ms.fm, {description: sk.description || ""}); msChanged(ms); return;
  }
  if (t.dataset.me) {
    const d = S.cache[S.key]; const c = curCluster(d); const ms = msFor(d, c); const a = t.dataset.me;
    if (a === "undo") msUndo(ms);
    else if (a === "menu") { S.meMenu = !S.meMenu; renderMergeEditor(); }
    else if (a === "rendered") { S.meRendered = !S.meRendered; renderMergeEditor(); }
    else if (a === "copy") meCopy(ms);
    else if (a.startsWith("reset-")) { pushHist(ms); msInit(d, c, ms, a.slice(6) === "draft" ? "draft" : a.slice(6)); S.meMenu = false; msChanged(ms); }
    return;
  }
  if (t.id === "xsumToggle") { const el = $("#xsum"); const open = el.classList.toggle("clamp"); t.textContent = open ? "Show all" : "Show less"; return; }
  if (t.id === "holisticSave") {
    const v = $("#holistic").value.trim(); if (!v) return;
    addNote({expert: S.key, kind: "expert", ref: S.key, body: v, type: $("#holisticType").value}).then(ok => { if (ok) $("#holistic").value = ""; });
  }
});
function flashNote(id){
  const m = $(`mark[data-note-id="${CSS.escape(id)}"]`);
  if (m) { m.scrollIntoView({block: "center", behavior: "smooth"}); m.classList.add("flash"); setTimeout(() => m.classList.remove("flash"), 1600); }
  else toast("The quoted text has changed since this note was left");
}
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "mpick") { go("expert", t.value); return; }
  if (t.dataset.mvpick) { S.mcid[S.key] = t.value; renderTabBody(); return; }
  if (t.dataset.meside) { const d = S.cache[S.key]; const ms = msFor(d, curCluster(d)); if (t.dataset.meside === "A") ms.left = t.value; else ms.right = t.value; msChanged(ms); return; }
  if (t.dataset.decBase) { saveDecision(t.dataset.decBase, Object.assign({base: t.value, choice: t.value ? "base" : (S.decisions[t.dataset.decBase] || {}).choice || null}, decisionTarget(t.dataset.decBase))); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.decNote) {
    const id = t.dataset.decNote; clearTimeout(noteTimers[id]);
    noteTimers[id] = setTimeout(() => saveDecision(id, Object.assign({note: t.value}, decisionTarget(id))), 700);
  }
  if (t.id === "railSearch") renderRail();
  if (t.dataset.row || t.dataset.fm) {
    const d = S.cache[S.key]; if (!d) return; const ms = msFor(d, curCluster(d));
    if (!ms.typing) { pushHist(ms); ms.typing = true; }
    clearTimeout(ms.typingT); ms.typingT = setTimeout(() => { ms.typing = false; }, 1200);
    if (t.dataset.row) { const r = ms.rows.find(x => x.id === t.dataset.row); if (r) { r.text = t.value; r.state = "done"; if (r.src !== "new") r.src = "edited"; } }
    else ms.fm = Object.assign({}, ms.fm, {[t.dataset.fm]: t.value});
    if (t.classList.contains("me-ta")) autoGrow(t);
    msChanged(ms, false);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.reader && !$("#composerBack")) closeReader(); });
document.addEventListener("toggle", e => { if (e.target && e.target.dataset && e.target.dataset.mvplan) S.mplan = e.target.open; }, true);
document.addEventListener("keydown", e => {
  if (!(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== "z" || e.shiftKey) return;
  if (S.view !== "expert" || S.tab !== "merge" || !$("#me")) return;
  const a = document.activeElement; if (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT")) return;
  e.preventDefault(); const d = S.cache[S.key]; msUndo(msFor(d, curCluster(d)));
});
document.addEventListener("mouseup", () => setTimeout(onSelection, 0));
document.addEventListener("keyup", e => { if (e.shiftKey || e.key === "Shift") onSelection(); });
document.addEventListener("touchend", () => setTimeout(onSelection, 30));
document.addEventListener("selectionchange", () => { const s = window.getSelection(); if (!s || s.isCollapsed) $("#selTip").hidden = true; });
$("#selTip").addEventListener("pointerdown", e => e.preventDefault());
$("#selTip").addEventListener("click", () => { $("#selTip").hidden = true; if (S.pending) openComposer(S.pending); window.getSelection().removeAllRanges(); });
window.addEventListener("hashchange", () => route());

function route(){
  const h = location.hash.slice(1);
  if (h === "roster") go("roster");
  else if (h && S.index.experts.some(x => x.key === h)) go("expert", h);
  else go("overview");
}
(async function boot(){
  try { await loadIndex(); }
  catch (e) { $("#main").innerHTML = `<div class="empty">The catalog data didn't load. Reload the page to try again.</div>`; return; }
  route();
  initDb();
})();
</script>
